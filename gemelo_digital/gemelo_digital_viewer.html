const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12141a);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(40, 45, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(24, 2, 24);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(30, 50, 20);
scene.add(dirLight);

const grid = new THREE.GridHelper(80, 40, 0x2a2d36, 0x1c1e24);
grid.position.set(24, 0, 24);
scene.add(grid);

const boxGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
const edgeGeo = new THREE.EdgesGeometry(boxGeo);

const meshes = [];
DATA.forEach(d => {
  const mat = new THREE.MeshLambertMaterial({ color: d.color });
  const mesh = new THREE.Mesh(boxGeo, mat);
  mesh.position.set(d.x, d.y, d.z);
  mesh.userData = d;
  scene.add(mesh);
  meshes.push(mesh);

  if (d.grua) {
    const edges = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
    edges.position.copy(mesh.position);
    scene.add(edges);
  }
});

document.getElementById('stats').textContent = `${DATA.length} SKU renderizados`;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');

function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(meshes);

  if (hits.length > 0) {
    const d = hits[0].object.userData;
    tooltip.style.display = 'block';
    tooltip.style.left = (event.clientX + 14) + 'px';
    tooltip.style.top = (event.clientY + 14) + 'px';
    tooltip.innerHTML = `<b>${d.sku}</b><br>${d.familia}<br>${d.zona}<br>${d.subzona}<br>Tiempo picking: ${d.heat} min/año${d.grua ? '<br><span style="color:#ffb4b4">Requiere grúa</span>' : ''}`;
  } else {
    tooltip.style.display = 'none';
  }
}
window.addEventListener('mousemove', onMouseMove);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
